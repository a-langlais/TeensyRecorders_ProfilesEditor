name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[build]"

      - name: Build application
        run: >-
          python compiler/compiler.py
          --dist-dir build/release/${{ matrix.platform }}/dist
          --work-dir build/pyinstaller/${{ matrix.platform }}
          --spec-dir build/spec/${{ matrix.platform }}

      - name: Package application
        run: >-
          python compiler/package_release.py
          --input-dir build/release/${{ matrix.platform }}/dist
          --output-file build/release/TeensyProfilesEditor-${{ matrix.platform }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: TeensyProfilesEditor-${{ matrix.platform }}
          path: build/release/TeensyProfilesEditor-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: TeensyProfilesEditor-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            Cette version n'apporte aucun changement majeur à l'application.
            Elle ajoute l'automatisation des releases GitHub ainsi que la version macOS,
            en complément des versions Windows et Linux.
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --notes "$RELEASE_NOTES"
