[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teensyrecorders-profiles-editor"
version = "0.4.0"
description = "Graphical editor for TeensyRecorders Profiles.ini files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Alexandre Langlais" },
]
dependencies = [
    "PySide6>=6.9,<7",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.16,<7",
]

[tool.setuptools]
packages = []
